<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Jheivy Silva - kkoko</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
            rel="stylesheet"
        />
    </head>

    <body
        class="font-['JetBrains+Mono',monospace] min-h-screen bg-black text-white"
    >
        <header></header>
        <main class="relative">
            <!-- Fondo -->
            <section
                class="-z-1 absolute top-0 left-0 right-0 flex flex-col md:flex-row md:flex-wrap h-[100dvh] w-full"
            >
                <article
                    class="overflow-hidden w-full h-1/3 md:w-1/3 md:h-full grid place-items-center"
                >
                    <img
                        aria-hidden="true"
                        draggable="false"
                        class="col-start-1 row-start-1 w-full h-full object-cover select-none pointer-events-none"
                        src="./assets/images/hero/hero-1.webp"
                        alt=""
                    />
                </article>

                <article
                    class="overflow-hidden w-full h-1/3 md:w-1/3 md:h-full grid place-items-center"
                >
                    <img
                        aria-hidden="true"
                        draggable="false"
                        class="col-start-1 row-start-1 w-full h-full object-cover select-none pointer-events-none"
                        src="./assets/images/hero/hero-2.webp"
                        alt=""
                    />
                </article>

                <article
                    class="overflow-hidden w-full h-1/3 md:w-1/3 md:h-full grid place-items-center"
                >
                    <img
                        aria-hidden="true"
                        draggable="false"
                        class="col-start-1 row-start-1 w-full h-full object-cover select-none pointer-events-none"
                        src="./assets/images/hero/hero-3.webp"
                        alt=""
                    />
                </article>
                <div class="absolute bottom-0 left-0 right-0 w-full h-full bg-linear-to-t from-black via-black/0 to-transparent"></div>
                <img
                    aria-hidden="true"
                    draggable="false"
                    class="z-10 absolute top-0 left-0 right-0 mix-blend-multiply opacity-50 w-full h-full object-cover select-none pointer-events-none"
                    src="./assets/images/hero/riso_texture.webp"
                    alt=""
                />
            </section>

            <!-- Contenido Hero -->
            <section
                class="z-1 flex flex-col md:items-center justify-center w-full h-[100dvh]"
            >
                <article class="flex flex-col md:items-center justify-center">
                    <h1
                        class="inline-block text-[clamp(5rem,8dvw,10rem)] leading-none text-left md:text-center"
                    >
                        Código preciso,
                    </h1>
                    <p
                        class="inline-block text-[clamp(3rem,10dvw,6rem)] leading-none text-left md:text-center"
                    >
                        diseño con <strong>alma.</strong>
                    </p>
                </article>
                <p
                    class="text-base md:text-xl text-left md:text-center max-w-none md:max-w-[40dvw]"
                >
                    Desarrollo productos digitales de principio a fin, interfaz,
                    backend y datos. Y en paralelo, arte y danza. Dos oficios
                    con el mismo criterio de detalle.
                </p>
            </section>
        </main>
        <footer></footer>
    </body>
</html>
